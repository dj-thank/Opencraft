name: OpenCraft CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencraft-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run complete fail-closed quality gate
        run: python scripts/full_quality_gate.py
      - name: Capture exact tracked source for diagnosis (not a release)
        if: always() && matrix.python-version == '3.11'
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/diagnostic-source.zip HEAD
          git rev-parse HEAD > dist/diagnostic-source-commit.txt
      - name: Upload unvalidated source diagnostics
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: unvalidated-source-diagnostics
          path: |
            dist/diagnostic-source.zip
            dist/diagnostic-source-commit.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report-py${{ matrix.python-version }}
          path: |
            dist/quality-report.json
            dist/full-quality-report.json
          if-no-files-found: warn
          retention-days: 14

  deterministic-source:
    name: Deterministic developer source snapshot
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/build_release.py
      - name: Build the same snapshot again
        run: |
          cp dist/OpenCraft-*-source.zip /tmp/first.zip
          python scripts/build_release.py
          cmp /tmp/first.zip dist/OpenCraft-*-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: opencraft-developer-preview-source
          path: |
            dist/OpenCraft-*-source.zip
            dist/SHA256SUMS.txt
            dist/artifact-manifest.json
            dist/sbom.spdx.json
            dist/release-readiness.json
          retention-days: 14
